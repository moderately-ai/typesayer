[package]
name = "typesayer"
description = "Typed structured prediction, prompt adaptation, evaluation, and optimization for language models"
readme = "../../README.md"
documentation = "https://docs.rs/typesayer"
keywords = ["llm", "structured-output", "prediction", "prompt", "optimization"]
categories = ["algorithms", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
openai = ["modelplease/openai"]

[dependencies]
typesayer-types.workspace = true
modelplease.workspace = true
parzen.workspace = true
async-trait.workspace = true
enumset.workspace = true
futures.workspace = true
once_cell.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
typesayer-parser = { workspace = true, features = ["test-utils"] }
insta.workspace = true
proptest.workspace = true
reqwest.workspace = true
tempfile.workspace = true

[[example]]
name = "basic_predict"
required-features = ["openai"]

[[example]]
name = "structured_extraction"
required-features = ["openai"]

[[example]]
name = "module_and_optimization"
required-features = ["openai"]

[[example]]
name = "mipro_optimization"
required-features = ["openai"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
