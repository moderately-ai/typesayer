name: release-crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified crate family version to crates.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3
        with:
          cache-bin: false
      - name: Require synchronized version and exact tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)
          test "$(wc -l <<<"$versions" | tr -d ' ')" = 1
          version=$versions
          test "$GITHUB_REF" = "refs/tags/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify packages in dependency order
        shell: bash
        run: |
          set -euo pipefail
          cargo publish --dry-run -p typesayer-types --locked
          cargo publish --dry-run -p typesayer-parser --locked \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/crates/typesayer-types'"
          cargo publish --dry-run -p typesayer --locked \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/crates/typesayer-types'" \
            --config "patch.crates-io.typesayer-parser.path='${GITHUB_WORKSPACE}/crates/typesayer-parser'"
      - name: Build candidates and inventories
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.version }}
          cargo package --no-verify -p typesayer-types --locked
          cargo package --no-verify -p typesayer-parser --locked \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/crates/typesayer-types'"
          cargo package --no-verify -p typesayer --locked \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/crates/typesayer-types'" \
            --config "patch.crates-io.typesayer-parser.path='${GITHUB_WORKSPACE}/crates/typesayer-parser'"
          for package in typesayer-types typesayer-parser typesayer; do
            cargo package --list -p "$package" --locked > "$RUNNER_TEMP/$package-$version.files"
          done
          mv "$RUNNER_TEMP"/typesayer*.files .
          sha256sum target/package/typesayer*.crate > crates.sha256
      - name: Compile packaged family as a downstream consumer
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.version }}
          cargo check --manifest-path "target/package/typesayer-types-$version/Cargo.toml"
          cargo check --manifest-path "target/package/typesayer-parser-$version/Cargo.toml" --all-features \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/target/package/typesayer-types-$version'"
          cargo check --manifest-path "target/package/typesayer-$version/Cargo.toml" --all-features \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/target/package/typesayer-types-$version'" \
            --config "patch.crates-io.typesayer-parser.path='${GITHUB_WORKSPACE}/target/package/typesayer-parser-$version'"
          cargo check --manifest-path tests/downstream/Cargo.toml \
            --config "patch.crates-io.typesayer-types.path='${GITHUB_WORKSPACE}/target/package/typesayer-types-$version'" \
            --config "patch.crates-io.typesayer-parser.path='${GITHUB_WORKSPACE}/target/package/typesayer-parser-$version'" \
            --config "patch.crates-io.typesayer.path='${GITHUB_WORKSPACE}/target/package/typesayer-$version'"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crates-io-candidates
          retention-days: 14
          if-no-files-found: error
          path: |
            target/package/typesayer*.crate
            typesayer*.files
            crates.sha256

  publish:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Publish family in dependency order
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "typesayer") | .version')
          test "$GITHUB_REF" = "refs/tags/v$version"

          publish_one() {
            package=$1
            case "$package" in
              typesayer-types) index=https://index.crates.io/ty/pe/typesayer-types ;;
              typesayer-parser) index=https://index.crates.io/ty/pe/typesayer-parser ;;
              typesayer) index=https://index.crates.io/ty/pe/typesayer ;;
              *) return 2 ;;
            esac
            published=$(curl --fail --silent --show-error "$index" 2>/dev/null | jq -r "select(.vers == \"$version\") | .cksum" | tail -1 || true)
            if [[ -n "$published" ]]; then
              echo "$package@$version already exists; skipping"
              return 0
            fi
            cargo package -p "$package" --locked
            expected=$(sha256sum "target/package/$package-$version.crate" | cut -d' ' -f1)
            cargo publish -p "$package" --locked
            for _ in {1..60}; do
              published=$(curl --fail --silent --show-error "$index" 2>/dev/null | jq -r "select(.vers == \"$version\") | .cksum" | tail -1 || true)
              [[ "$published" == "$expected" ]] && return 0
              sleep 5
            done
            echo "$package@$version did not reach the registry with the expected checksum" >&2
            return 1
          }

          publish_one typesayer-types
          publish_one typesayer-parser
          publish_one typesayer

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME}
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
